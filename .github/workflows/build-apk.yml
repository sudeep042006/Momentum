name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title (e.g. Momentum v1.0.1)'
        required: false
        default: 'Momentum Update'
      release_notes:
        description: 'Release Notes (What is new)'
        required: false
        default: 'New improvements and bug fixes.'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: |
          cd mobile
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/momentum-release.keystore
            echo "Release keystore decoded successfully."
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret not found. Using debug keystore fallback."
          fi

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'momentum2026pass' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'momentum' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'momentum2026pass' }}
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare APK File
        id: prepare_apk
        run: |
          TAG_OR_RUN="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_OR_RUN="build-${{ github.run_number }}"
          fi
          APK_PATH="mobile/android/app/build/outputs/apk/release/app-release.apk"
          OUT_APK="mobile/android/app/build/outputs/apk/release/Momentum-${TAG_OR_RUN}.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "$OUT_APK"
            echo "apk_path=$OUT_APK" >> $GITHUB_OUTPUT
            echo "apk_name=Momentum-${TAG_OR_RUN}.apk" >> $GITHUB_OUTPUT
          else
            echo "APK not found at $APK_PATH"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ github.event.inputs.release_title || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('Momentum v1.0.{0}', github.run_number) }}
          body: ${{ github.event.inputs.release_notes || github.event.head_commit.message || 'New Momentum mobile release.' }}
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
